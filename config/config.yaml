# Top-level Snakemake config. Phase-specific thresholds/parameters live in
# their own files (qc_thresholds.yaml, graph_parameters.yaml,
# sender_receiver_pairs.yaml, ...), generated by the phase scripts that own
# them rather than hand-edited here.
project_name: xenium-tcr-ecology

# Central, documented random seeds. Read by
# xenium_tcr_ecology.infra.seeding (Python) and R/seeding.R (R) -- do not
# hardcode a local RNG_SEED/rng_seed constant in a new script; read one of
# these two instead. Two real, distinct seeds exist in this project's own
# history and are both preserved exactly as originally used, not unified:
default_seed: 42       # every stochastic procedure outside the annotation stack
                        # (permutation tests, bootstrap CIs, subsampling, graph
                        # null models)
annotation_seed: 0      # the annotation/preprocessing/tumour-scoring stack
                        # (stages 05-07: clustering, T-cell substate scoring,
                        # program scores, malignancy scoring, blinded review)
                        # -- predates default_seed's introduction elsewhere;
                        # kept separate deliberately so centralising it does
                        # not silently change already-frozen, checksummed
                        # results that most of stages 08-17 depend on
