# Structured, GEO-sourced sample manifest input, feeding
# scripts/01_project_setup_and_governance/01_build_sample_manifest.py.
#
# PROVENANCE: every field below was fetched directly from the individual
# GSM SOFT-format text records at
# https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=<GSM>&targ=self&view=brief&form=text
# on 2026-07-10 (all 18 GSM accessions under GSE300147, fetched
# individually and verbatim -- not inferred, not carried over from the
# earlier PMC-derived cohort summary). Internal consistency check: 18
# records resolve to exactly 10 HNSCC patients (7 with two runs = technical
# replicates, 3 with one run) = 17 HNSCC sections, plus 1 non-HNSCC
# ameloblastoma specimen (patient numbered 10 in GEO, GSM9054488) -- this
# matches the source paper's own reported cohort facts, which is strong
# evidence this GEO-level extraction is accurate, but the raw GSM text
# itself has not been separately re-read by a human. Spot-check a few
# records directly if this
# manifest drives a real download in Raw Data Ingestion.
#
# p16_ihc_status is GEO's own field name and is a clinical IHC surrogate for
# HPV status, not the molecular Xenium HPV16-E5 probe signal -- `15_hpv_stratified_analysis/00_validate_hpv_metadata_and_probe_signal.py`
# (validate_hpv_metadata_and_probe_signal) cross-checks this field against
# that separate molecular readout once Raw Data Ingestion+ data exists. Do not conflate
# the two.

source:
  accession: GSE300147
  fetched_via: "Individual GSM SOFT-format text records via NCBI GEO"
  fetched_date: "2026-07-10"
  compiled_by: "Irvine Tatenda Mutiti"

