# Human-edited environment spec (committed). Machine-generated lock outputs
# (environment.lock, environment.resolved.yml, R_sessionInfo.txt) are
# gitignored and regenerated by scripts/01_project_setup_and_governance/03_lock_software_environments.sh
# -- kept separate from this human-edited spec so the exact resolved
# versions used for a given run are always machine-reproducible, not
# hand-maintained.
#
# Scope, deliberately: this locks what Phases 1-10 need (import, QC,
# preprocessing, annotation, tumour/TCR calling, graphs, niches), not the
# whole 18-phase pipeline's eventual dependency set. r-brms in particular
# requires a compiled Stan toolchain and is slow/fragile to install; it is
# not needed until Clone Ecology Confirmatory Models (confirmatory variance-partition models) and
# will be added then via a versioned environment update
# (environment/conda/main.yml -> a new pinned revision), not locked
# speculatively now. This is a deliberate incremental-locking choice, not an
# oversight -- see CHANGELOG.md for when dependency groups are added.
name: xenium-tcr-ecology
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - anndata
  - scanpy
  - squidpy
  - spatialdata
  - spatialdata-io
  - networkx
  - pyarrow
  - openpyxl
  - pyyaml
  - requests
  - snakemake-minimal
  - python-igraph  # `06_cell_type_annotation/01_cluster_within_patient_and_jointly.py` -- scanpy's Leiden clustering backend
  - leidenalg      # `06_cell_type_annotation/01_cluster_within_patient_and_jointly.py` -- Leiden community detection algorithm itself
  - fast_matrix_market  # `06_cell_type_annotation/03_map_external_scrna_reference.py` -- scipy.io.mmread is impractically slow
                         # (pure-Python parser) on GSE287301's 706M-nonzero
                         # matrix.mtx; this is a fast C++ MatrixMarket reader
  - matplotlib     # `06_cell_type_annotation/07_blinded_annotation_review.py` -- renders blinded spatial review panels;
                   # was already a transitive dependency of scanpy/squidpy,
                   # pinned explicitly now that this repo's own code calls
                   # it directly
  - markdown       # `src/xenium_tcr_ecology/release/manuscript.py` -- renders the .qmd manuscript source
                   # to PDF via markdown+xhtml2pdf when no Quarto/pandoc/LaTeX install is
                   # present (see that module's docstring); imported unconditionally at module
                   # level, so also required simply to collect `tests/unit/test_release_manuscript.py`
  - xhtml2pdf      # paired with markdown above -- same rendering path, same module
  - poppler        # `src/xenium_tcr_ecology/infra/figure_export.py` shells out to `pdftocairo`
                   # (part of poppler-utils) for PDF -> PNG/SVG main-figure export;
                   # exercised directly by `tests/unit/test_release_main_figures.py`
  - pytest
  - ruff=0.6.9    # pinned to match .pre-commit-config.yaml's ruff-pre-commit rev (v0.6.9) exactly,
                  # so `ruff check` run directly (e.g. CI's fast-tier, which does not go through
                  # pre-commit) agrees with the pre-commit hook rather than drifting against it
  - black=24.10.0 # pinned to match .pre-commit-config.yaml's black rev exactly, same reason
  - mypy
  - pre-commit
  - python-build  # `src/xenium_tcr_ecology/release/software_package.py` shells out to `python -m build`
                  # (`17_statistical_closure_and_release/07_build_documented_software_package.py`)
  - r-base=4.4
  - r-tidyverse
  - r-lme4
  - r-renv
  - r-arrow      # reads `03_spatialdata_import/06_export_r_interoperability_objects.py`'s obs/var_metadata.parquet exports
  - r-matrix     # reads `03_spatialdata_import/06_export_r_interoperability_objects.py`'s matrix.mtx.gz exports (readMM)
  - r-yaml       # `04_quality_control/06_define_qc_thresholds_hierarchically.R` writes config/qc_thresholds.yaml (was already a
                 # transitive dependency; pinned explicitly since this repo's
                 # own R code calls it directly)
  - r-testthat   # first direct use: tests/r_unit/ (`04_quality_control/06_define_qc_thresholds_hierarchically.R` onward -- this
                 # project has 11+ scaffolded R scripts across later phases,
                 # so establishing R test coverage now, not deferring it)
# After `conda env create -f environment/conda/main.yml && conda activate
# xenium-tcr-ecology`, install the package itself in editable mode:
#   pip install -e ".[dev]"
# (deliberately not done via a pip: section here -- a relative -e path in
# this file resolves against the invoking shell's cwd, not this file's
# location, and silently does the wrong thing if conda env create is run
# from anywhere other than the repo root).
#
# Deferred to later, versioned environment updates when/if the work that
# needs them is actually implemented:
#   - torch / GPU stack                        -> only if a deep graph model is ever added
#                                                  (explicitly optional, not planned)
#
# r-brms (a Stan/C++ toolchain) was planned for Clone Ecology Confirmatory
# Models' variance-partition models but never added: the real
# implementation (`13_clone_ecology_confirmatory_models/01_fit_variance_partition_models.R`)
# uses `r-lme4` (already pinned above, already validated elsewhere in this
# pipeline) instead, avoiding an unnecessary compiled-toolchain dependency.
#
# r-seurat is deliberately NOT a dependency of this repo's own environment:
# `03_spatialdata_import/06_export_r_interoperability_objects.py` exports the standard 10x Matrix Market triplet (readable by
# Seurat's own Read10X() with zero Seurat-specific export logic on this
# side), so downstream R analysts install Seurat in their own environment
# when they actually load these exports -- this repo's environment only
# needs to *write* the export format, not construct a Seurat object itself.
